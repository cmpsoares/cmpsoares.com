[build]
  publish = "public"
  command = "hugo --minify --gc"
  
[build.environment]
  HUGO_VERSION = "0.91.2"
  HUGO_BASEURL = "https://cmpsoares.com/"
  # Skip vendored theme demo content from secrets scanning; those are upstream
  # placeholder keys, not real credentials, and the exampleSite isn't built.
  SECRETS_SCAN_OMIT_PATHS = "themes/agico-hugo/exampleSite/**"

# After this deploy: delete the registered Netlify form named "contact" in
# Site settings → Forms. Removing the HTML stops detection at build time;
# a leftover registered form can still accept POSTs until it is deleted.
# Request-time block is the forced catch-all 301 in static/_redirects.

