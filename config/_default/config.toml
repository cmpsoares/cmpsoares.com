######################## default configuration ####################
baseURL = "https://cmpsoares.com/"
title = "CMPSOARES | Automating Your Business Together"
theme = "agico-hugo"
# post pagination
[pagination]
pagerSize = 6
# post excerpt
summaryLength = "10"
# google analytics
googleAnalytics = "G-832LF9WB7T" # example: UA-123-45, for more info, read the article https://support.google.com/analytics/answer/1008080?hl=en
# disqus short name
disqusShortname = "cmpsoares-com" # get your shortname from here : https://disqus.com

[services.disqus]
shortname = "cmpsoares-com"
# disable language
disableLanguages = [] # example: ["fr"] for disable french language

############################# Outputs ##############################
# Brand sunset: serve static/robots.txt (Disallow: /) and do not generate a sitemap.
enableRobotsTXT = false
disableKinds = ["sitemap"]

[author]
  name = 'C.M.P.Soares, Lda.'

[outputs]
home = ["HTML", "RSS", "JSON"]

[markup]
[markup.goldmark.renderer]
unsafe= true

[mediaTypes]
[mediaTypes."application/manifest+json"]
suffixes = ["webmanifest"]

[mediaTypes."text/netlify"]
delimiter = ""
suffixes = [""]

[outputFormats]
[outputFormats.WebAppManifest]
mediaType = "application/manifest+json"
rel = "manifest"